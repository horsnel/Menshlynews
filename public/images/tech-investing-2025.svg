<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="50%" style="stop-color:#2d2b55"/>
      <stop offset="100%" style="stop-color:#3d3a6e"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6cf0;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7c6cf0;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Circuit pattern -->
  <g opacity="0.12" stroke="#7c6cf0" stroke-width="1" fill="none">
    <path d="M100,0 L100,150 L200,150 L200,250 L300,250"/>
    <path d="M300,0 L300,100 L400,100 L400,200 L500,200 L500,300"/>
    <path d="M500,0 L500,80 L600,80 L600,180 L700,180"/>
    <path d="M0,200 L150,200 L150,300 L250,300 L250,400"/>
    <path d="M400,250 L500,250 L500,350 L600,350 L600,450"/>
    <circle cx="200" cy="150" r="4" fill="#7c6cf0"/><circle cx="400" cy="100" r="4" fill="#7c6cf0"/>
    <circle cx="600" cy="80" r="4" fill="#7c6cf0"/><circle cx="250" cy="300" r="4" fill="#7c6cf0"/>
    <circle cx="500" cy="250" r="4" fill="#7c6cf0"/>
  </g>
  <!-- Floating chips/cards representing tech companies -->
  <g transform="translate(120,100)">
    <rect width="80" height="100" rx="8" fill="#7c6cf0" opacity="0.3"/>
    <rect x="8" y="8" width="64" height="30" rx="4" fill="#9d8cf5" opacity="0.5"/>
    <text x="40" y="28" font-family="monospace" font-size="10" fill="white" text-anchor="middle">QD</text>
    <rect x="12" y="48" width="56" height="4" rx="2" fill="white" opacity="0.2"/>
    <rect x="12" y="58" width="40" height="4" rx="2" fill="white" opacity="0.15"/>
    <rect x="12" y="68" width="48" height="4" rx="2" fill="white" opacity="0.15"/>
  </g>
  <g transform="translate(280,60)">
    <rect width="80" height="100" rx="8" fill="#f06c9b" opacity="0.3"/>
    <rect x="8" y="8" width="64" height="30" rx="4" fill="#f09bb5" opacity="0.5"/>
    <text x="40" y="28" font-family="monospace" font-size="10" fill="white" text-anchor="middle">NF</text>
    <rect x="12" y="48" width="56" height="4" rx="2" fill="white" opacity="0.2"/>
    <rect x="12" y="58" width="40" height="4" rx="2" fill="white" opacity="0.15"/>
    <rect x="12" y="68" width="48" height="4" rx="2" fill="white" opacity="0.15"/>
  </g>
  <g transform="translate(440,90)">
    <rect width="80" height="100" rx="8" fill="#6cf0c8" opacity="0.3"/>
    <rect x="8" y="8" width="64" height="30" rx="4" fill="#6cf0d8" opacity="0.5"/>
    <text x="40" y="28" font-family="monospace" font-size="10" fill="white" text-anchor="middle">BC</text>
    <rect x="12" y="48" width="56" height="4" rx="2" fill="white" opacity="0.2"/>
    <rect x="12" y="58" width="40" height="4" rx="2" fill="white" opacity="0.15"/>
    <rect x="12" y="68" width="48" height="4" rx="2" fill="white" opacity="0.15"/>
  </g>
  <g transform="translate(600,70)">
    <rect width="80" height="100" rx="8" fill="#f0c86c" opacity="0.3"/>
    <rect x="8" y="8" width="64" height="30" rx="4" fill="#f0d88c" opacity="0.5"/>
    <text x="40" y="28" font-family="monospace" font-size="10" fill="white" text-anchor="middle">EF</text>
    <rect x="12" y="48" width="56" height="4" rx="2" fill="white" opacity="0.2"/>
    <rect x="12" y="58" width="40" height="4" rx="2" fill="white" opacity="0.15"/>
    <rect x="12" y="68" width="48" height="4" rx="2" fill="white" opacity="0.15"/>
  </g>
  <!-- Rising arrow -->
  <g transform="translate(350,240)">
    <path d="M0,80 L40,20 L80,80" fill="none" stroke="#f0c86c" stroke-width="3" opacity="0.6"/>
    <line x1="40" y1="20" x2="40" y2="120" stroke="#f0c86c" stroke-width="3" opacity="0.4"/>
    <polygon points="40,5 30,25 50,25" fill="#f0c86c" opacity="0.7"/>
  </g>
  <!-- Title -->
  <text x="60" y="430" font-family="system-ui,sans-serif" font-size="18" fill="white" font-weight="bold" opacity="0.95">7 Emerging Tech Companies</text>
  <text x="60" y="415" font-family="system-ui,sans-serif" font-size="11" fill="#9d8cf5" opacity="0.8">TECHNOLOGY × INVESTING 2025</text>
</svg>