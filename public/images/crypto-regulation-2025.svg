<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2137"/>
      <stop offset="50%" style="stop-color:#163a5f"/>
      <stop offset="100%" style="stop-color:#1e5080"/>
    </linearGradient>
    <linearGradient id="node4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a"/>
      <stop offset="100%" style="stop-color:#f0b860"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <!-- Blockchain nodes network -->
  <g opacity="0.3" stroke="#f7931a" stroke-width="1.5">
    <line x1="200" y1="120" x2="400" y2="80"/><line x1="400" y1="80" x2="600" y2="130"/>
    <line x1="200" y1="120" x2="350" y2="250"/><line x1="400" y1="80" x2="500" y2="220"/>
    <line x1="600" y1="130" x2="500" y2="220"/><line x1="350" y1="250" x2="500" y2="220"/>
    <line x1="350" y1="250" x2="250" y2="350"/><line x1="500" y1="220" x2="450" y2="340"/>
    <line x1="500" y1="220" x2="620" y2="300"/><line x1="250" y1="350" x2="450" y2="340"/>
    <line x1="450" y1="340" x2="620" y2="300"/>
  </g>
  <!-- Nodes -->
  <circle cx="200" cy="120" r="16" fill="url(#node4)" opacity="0.8"/>
  <text x="200" y="125" font-family="monospace" font-size="11" fill="white" text-anchor="middle" font-weight="bold">₿</text>
  <circle cx="400" cy="80" r="20" fill="url(#node4)" opacity="0.9"/>
  <text x="400" y="86" font-family="monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Ξ</text>
  <circle cx="600" cy="130" r="14" fill="url(#node4)" opacity="0.7"/>
  <circle cx="350" cy="250" r="18" fill="url(#node4)" opacity="0.8"/>
  <text x="350" y="255" font-family="monospace" font-size="10" fill="white" text-anchor="middle">◆</text>
  <circle cx="500" cy="220" r="16" fill="url(#node4)" opacity="0.75"/>
  <circle cx="250" cy="350" r="12" fill="url(#node4)" opacity="0.6"/>
  <circle cx="450" cy="340" r="14" fill="url(#node4)" opacity="0.65"/>
  <circle cx="620" cy="300" r="12" fill="url(#node4)" opacity="0.55"/>
  <!-- Gavel / regulation symbol -->
  <g transform="translate(330,130)" opacity="0.85">
    <rect x="20" y="0" width="60" height="12" rx="3" fill="white" opacity="0.9"/>
    <rect x="42" y="12" width="16" height="40" rx="2" fill="white" opacity="0.7"/>
    <rect x="10" y="52" width="80" height="6" rx="2" fill="white" opacity="0.5"/>
  </g>
  <!-- Shield / compliance -->
  <g transform="translate(530,170)" opacity="0.6">
    <path d="M25,0 L50,12 L50,35 C50,50 25,60 25,60 C25,60 0,50 0,35 L0,12Z" fill="none" stroke="white" stroke-width="2"/>
    <path d="M18,25 L25,32 L38,18" fill="none" stroke="#76bf9f" stroke-width="3"/>
  </g>
  <!-- Title -->
  <text x="60" y="430" font-family="system-ui,sans-serif" font-size="18" fill="white" font-weight="bold" opacity="0.95">Crypto Regulation 2025</text>
  <text x="60" y="415" font-family="system-ui,sans-serif" font-size="11" fill="#f7931a" opacity="0.8">CRYPTO × REGULATION × POLICY</text>
</svg>