<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c3a"/>
      <stop offset="50%" style="stop-color:#166f4f"/>
      <stop offset="100%" style="stop-color:#1c9373"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#76bf9f;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#a8e6cf;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Grid pattern -->
  <g opacity="0.08" stroke="white" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
  </g>
  <!-- Chart line going up -->
  <path d="M80,350 L180,320 L280,300 L340,310 L400,260 L480,220 L540,180 L620,140 L700,90" fill="none" stroke="#76bf9f" stroke-width="3" opacity="0.9"/>
  <path d="M80,350 L180,320 L280,300 L340,310 L400,260 L480,220 L540,180 L620,140 L700,90 L700,450 L80,450Z" fill="url(#accent1)"/>
  <!-- Data points -->
  <circle cx="80" cy="350" r="5" fill="#a8e6cf"/><circle cx="280" cy="300" r="5" fill="#a8e6cf"/>
  <circle cx="400" cy="260" r="5" fill="#a8e6cf"/><circle cx="540" cy="180" r="5" fill="#a8e6cf"/>
  <circle cx="620" cy="140" r="5" fill="#a8e6cf"/><circle cx="700" cy="90" r="6" fill="white"/>
  <!-- AI Brain icon -->
  <g transform="translate(340,80)">
    <circle cx="60" cy="40" r="35" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <circle cx="48" cy="32" r="4" fill="#76bf9f"/><circle cx="72" cy="32" r="4" fill="#76bf9f"/>
    <circle cx="60" cy="48" r="4" fill="#76bf9f"/>
    <line x1="48" y1="32" x2="72" y2="32" stroke="#76bf9f" stroke-width="1.5"/>
    <line x1="48" y1="32" x2="60" y2="48" stroke="#76bf9f" stroke-width="1.5"/>
    <line x1="72" y1="32" x2="60" y2="48" stroke="#76bf9f" stroke-width="1.5"/>
    <circle cx="48" cy="50" r="3" fill="white" opacity="0.5"/>
    <circle cx="72" cy="50" r="3" fill="white" opacity="0.5"/>
  </g>
  <!-- Title -->
  <text x="60" y="430" font-family="system-ui,sans-serif" font-size="18" fill="white" font-weight="bold" opacity="0.95">AI-Driven Wealth Strategy</text>
  <text x="60" y="415" font-family="system-ui,sans-serif" font-size="11" fill="#a8e6cf" opacity="0.8">FINANCE × MACHINE LEARNING</text>
</svg>